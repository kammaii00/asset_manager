# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './web_app/package-lock.json'

      # Next.js 프로덕션 빌드에 Admin SDK용 서비스 계정 JSON이 필요함(로컬은 .env.local, CI에는 없으면 API 500)
      # 배포 인증용 키(github-action SA)와 앱 Admin SDK용 키(firebase-adminsdk SA)는 권한이 달라 시크릿을 분리한다.
      - name: Create env file
        working-directory: ./web_app
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "NEXT_PUBLIC_ALLOWED_EMAILS=${{ secrets.NEXT_PUBLIC_ALLOWED_EMAILS }}" > .env.production
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            # JSON을 그대로 .env에 쓰면 내부의 큰따옴표·개행 때문에 dotenv가 값을 잘라먹어 파싱이 깨진다.
            # base64는 영숫자만이라 .env 한 줄에 안전하게 담긴다(embed-firebase-admin.mjs에서 디코딩).
            node -e "const fs=require('fs'); const b64=Buffer.from(process.env.FIREBASE_SERVICE_ACCOUNT_JSON,'utf8').toString('base64'); fs.appendFileSync('.env.production', 'FIREBASE_SERVICE_ACCOUNT_JSON_BASE64=' + b64 + String.fromCharCode(10));"
          fi

      - name: Install dependencies and build
        working-directory: ./web_app
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASSET_MASTER_JWPARK }}
          channelId: live
          projectId: asset-master-jwpark
          entryPoint: ./web_app
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          # CLI가 webframeworks로 앱을 재빌드할 때도 Admin SDK 자격증명이 필요하다(배포 인증 키가 아님).
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON }}
